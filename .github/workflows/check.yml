name: Cloud Environment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - name: Skill progression regressions
        run: |
          ./node_modules/.bin/esbuild tests/skill-progression.test.ts --bundle --platform=node --format=esm --outfile=/tmp/skills-test.mjs
          node /tmp/skills-test.mjs
      - name: Story and secret progression regressions
        run: |
          ./node_modules/.bin/esbuild tests/map-layout.test.ts --bundle --platform=node --format=esm --outfile=/tmp/map-layout-test.mjs
          node /tmp/map-layout-test.mjs
          ./node_modules/.bin/esbuild tests/opening-story.test.ts --bundle --platform=node --format=esm --outfile=/tmp/opening-story-test.mjs
          node /tmp/opening-story-test.mjs
          ./node_modules/.bin/esbuild tests/actor-motion.test.ts --bundle --platform=node --format=esm --outfile=/tmp/actor-motion-test.mjs
          node /tmp/actor-motion-test.mjs
          ./node_modules/.bin/esbuild tests/expansion.test.ts --bundle --platform=node --format=esm --outfile=/tmp/expansion-test.mjs
          node /tmp/expansion-test.mjs
          ./node_modules/.bin/esbuild tests/meridians-codex.test.ts --bundle --platform=node --format=esm --outfile=/tmp/meridians-codex-test.mjs
          node /tmp/meridians-codex-test.mjs
          ./node_modules/.bin/esbuild tests/titles.test.ts --bundle --platform=node --format=esm --outfile=/tmp/titles-test.mjs
          node /tmp/titles-test.mjs
      - run: npm run build
      - run: npm run db:migrate
      - run: node tests/d1-commerce-smoke.mjs
      - name: Multiplayer, quest tracking and story continuation smoke tests
        run: |
          npm start >/tmp/rpg-smoke-server.log 2>&1 &
          rpg_server_pid=$!
          trap 'kill "$rpg_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8787/api/rpg >/dev/null; then break; fi
            sleep 1
          done
          node tests/chat-smoke.mjs
          node tests/quest-journal-smoke.mjs
          node tests/starter-tail-smoke.mjs
          node tests/wide-maps-smoke.mjs
  postgres-admin:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rpg
          POSTGRES_DB: rpg_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rpg -d rpg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rpg@localhost:5432/rpg_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - run: |
          ./node_modules/.bin/esbuild tests/postgres-sql.test.ts --bundle --platform=node --format=esm --outfile=/tmp/postgres-sql-test.mjs
          node /tmp/postgres-sql-test.mjs
      - run: npm run build:render
      - run: node tests/postgres-admin-smoke.mjs
        env:
          COMMERCE_CHECKOUT_TEST: "1"
